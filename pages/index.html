<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPaper AI - 医学论文写作全流程自动化</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f7f7f8;
            --bg-tertiary: #f0f0f0;
            --bg-card: #ffffff;
            --bg-hover: #f0f0f0;
            --border-color: #e5e5e5;
            --border-light: #eeeeee;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --accent-blue: #2d7cf6;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --gradient-primary: linear-gradient(135deg, #2d7cf6 0%, #8b5cf6 100%);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
        }

        [data-theme="dark"] {
            --bg-primary: #0f0f0f;
            --bg-secondary: #171717;
            --bg-tertiary: #1f1f1f;
            --bg-card: #1a1a1a;
            --bg-hover: #262626;
            --border-color: #2a2a2a;
            --border-light: #333333;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --text-tertiary: #666666;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== 主布局 ===== */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: 0;
            border-right: none;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            width: 36px;
            height: 36px;
            background: var(--gradient-primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 17px;
            font-weight: 600;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .new-chat-btn {
            margin: 16px;
            padding: 12px 16px;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 16px;
        }

        .chat-group-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-tertiary);
            padding: 12px 8px 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 2px;
        }

        .chat-item:hover {
            background: var(--bg-hover);
        }

        .chat-item.active {
            background: var(--bg-tertiary);
        }

        .chat-item-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            font-size: 14px;
        }

        .chat-item-title {
            flex: 1;
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item.active .chat-item-title {
            color: var(--text-primary);
            font-weight: 500;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .user-plan {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .theme-toggle {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* ===== 主内容区 ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            height: 52px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            flex-shrink: 0;
        }

        .sidebar-toggle {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .sidebar-toggle:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .chat-title {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .api-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .api-badge.connected {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .api-badge.disconnected {
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent-orange);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        /* ===== 聊天区域 ===== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
        }

        .chat-messages {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 欢迎界面 */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-logo {
            width: 72px;
            height: 72px;
            background: var(--gradient-primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 24px;
            box-shadow: var(--shadow-lg);
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 12px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            max-width: 500px;
            line-height: 1.6;
        }

        .quick-prompts {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 640px;
            width: 100%;
            margin-bottom: 32px;
        }

        .quick-prompt-card {
            padding: 18px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .quick-prompt-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .quick-prompt-icon {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .quick-prompt-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .quick-prompt-desc {
            font-size: 12px;
            color: var(--text-tertiary);
            line-height: 1.5;
        }

        /* 消息气泡 */
        .message {
            display: flex;
            gap: 16px;
            animation: messageFadeIn 0.3s ease;
        }

        @keyframes messageFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
        }

        .message.assistant .message-avatar {
            background: var(--gradient-primary);
            color: white;
        }

        .message.user .message-avatar {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .message-content {
            max-width: calc(100% - 100px);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message.user .message-content {
            align-items: flex-end;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.7;
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.assistant .message-bubble {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-top-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: var(--accent-blue);
            color: white;
            border-top-right-radius: 4px;
        }

        .message-bubble p {
            margin-bottom: 10px;
        }

        .message-bubble p:last-child {
            margin-bottom: 0;
        }

        .message-bubble ul, .message-bubble ol {
            margin: 8px 0 8px 20px;
        }

        .message-bubble li {
            margin-bottom: 4px;
        }

        .message-bubble strong {
            font-weight: 600;
        }

        .message-meta {
            font-size: 11px;
            color: var(--text-tertiary);
            display: flex;
            gap: 12px;
        }

        .message.user .message-meta {
            justify-content: flex-end;
        }

        /* 思考过程 */
        .thinking-block {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .thinking-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .thinking-dots {
            display: inline-flex;
            gap: 4px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-tertiary);
            animation: dotPulse 1.4s infinite;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotPulse {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 步骤进度 */
        .step-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            flex-wrap: wrap;
        }

        .step-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .step-chip.active {
            background: rgba(45, 124, 246, 0.1);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .step-chip.done {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .step-chip-icon {
            font-size: 12px;
        }

        /* 代码块/文献卡片 */
        .literature-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 16px;
            margin: 8px 0;
        }

        .literature-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .literature-meta {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .literature-abstract {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .literature-source {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(45, 124, 246, 0.1);
            color: var(--accent-blue);
            border-radius: 4px;
            font-size: 11px;
            margin-top: 8px;
        }

        /* ===== 输入区域 ===== */
        .input-area {
            padding: 16px 24px 24px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-primary);
            flex-shrink: 0;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        .input-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 4px;
            transition: all 0.2s;
        }

        .input-container:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(45, 124, 246, 0.1);
        }

        .input-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .tool-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--text-tertiary);
            transition: all 0.15s;
        }

        .tool-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .input-textarea {
            width: 100%;
            padding: 14px 16px;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-primary);
            font-family: inherit;
            max-height: 200px;
            min-height: 48px;
        }

        .input-textarea::placeholder {
            color: var(--text-tertiary);
        }

        .input-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
        }

        .input-hint {
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .send-btn {
            padding: 8px 20px;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 440px;
            box-shadow: var(--shadow-lg);
            animation: modalFadeIn 0.2s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .modal-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(45, 124, 246, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.15s;
        }

        .btn:hover {
            background: var(--bg-hover);
        }

        .btn-primary {
            background: var(--gradient-primary);
            border: none;
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                z-index: 100;
                height: 100%;
            }

            .quick-prompts {
                grid-template-columns: 1fr;
            }

            .chat-messages {
                padding: 0 16px;
            }

            .input-area {
                padding: 12px 16px 16px;
            }

            .message-content {
                max-width: calc(100% - 60px);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">M</div>
                <span class="logo-text">MedPaper AI</span>
            </div>
            
            <button class="new-chat-btn" onclick="newChat()">
                <span>✏️</span>
                <span>新建对话</span>
            </button>
            
            <div class="chat-list" id="chatList">
                <div class="chat-group-title">最近对话</div>
                <div id="chatListItems"></div>
            </div>
            
            <div class="sidebar-footer">
                <div class="user-avatar">U</div>
                <div class="user-info">
                    <div class="user-name">研究者</div>
                    <div class="user-plan">科研版</div>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">🌙</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="top-bar">
                <button class="sidebar-toggle" onclick="toggleSidebar()" title="切换侧边栏">☰</button>
                <div class="chat-title" id="chatTitle">医学论文写作助手</div>
                <div class="top-actions">
                    <span class="api-badge disconnected" id="apiBadge" onclick="openApiModal()" title="点击配置后端地址">演示模式</span>
                </div>
            </header>

            <!-- 聊天区域 -->
            <div class="chat-container" id="chatContainer">
                <div class="chat-messages" id="chatMessages">
                    <!-- 欢迎界面 -->
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-logo">M</div>
                        <h1 class="welcome-title">MedPaper AI</h1>
                        <p class="welcome-subtitle">
                            医学论文写作全流程自动化助手，基于 AI Agent 架构，
                            从文献检索到润色投稿，一站式完成您的科研论文。
                        </p>
                        
                        <div class="quick-prompts">
                            <div class="quick-prompt-card" onclick="sendQuickPrompt('帮我检索一下「依达拉奉联合丁苯酞治疗急性脑梗死」的最新研究进展')">
                                <div class="quick-prompt-icon">🔬</div>
                                <div class="quick-prompt-title">文献检索</div>
                                <div class="quick-prompt-desc">检索 PubMed、OpenAlex 等数据库的最新文献</div>
                            </div>
                            <div class="quick-prompt-card" onclick="sendQuickPrompt('帮我生成一篇关于「糖尿病治疗新进展」的论文大纲')">
                                <div class="quick-prompt-icon">📋</div>
                                <div class="quick-prompt-title">大纲生成</div>
                                <div class="quick-prompt-desc">根据研究主题智能生成论文结构大纲</div>
                            </div>
                            <div class="quick-prompt-card" onclick="sendQuickPrompt('帮我写一篇「肺癌靶向治疗」的综述论文，3000字左右')">
                                <div class="quick-prompt-icon">✍️</div>
                                <div class="quick-prompt-title">论文写作</div>
                                <div class="quick-prompt-desc">自动生成完整的医学论文内容</div>
                            </div>
                            <div class="quick-prompt-card" onclick="sendQuickPrompt('帮我润色这篇论文并检查投稿格式')">
                                <div class="quick-prompt-icon">✨</div>
                                <div class="quick-prompt-title">润色投稿</div>
                                <div class="quick-prompt-desc">论文润色、术语修正、格式检查</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="input-area">
                <div class="input-wrapper">
                    <div class="input-container">
                        <div class="input-toolbar">
                            <button class="tool-btn" title="上传文件">📎</button>
                            <button class="tool-btn" title="插入文献">📚</button>
                            <button class="tool-btn" title="模板">📄</button>
                        </div>
                        <textarea 
                            class="input-textarea" 
                            id="messageInput" 
                            placeholder="输入您的研究主题或问题，按 Enter 发送，Shift+Enter 换行..."
                            rows="1"
                            onkeydown="handleKeyDown(event)"
                            oninput="autoResize(this)"
                        ></textarea>
                        <div class="input-footer">
                            <span class="input-hint">MedPaper 可能会出错，请核对重要信息</span>
                            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                                <span>发送</span>
                                <span>➤</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- API 配置模态框 -->
    <div class="modal-overlay" id="apiModal">
        <div class="modal">
            <h2 class="modal-title">后端 API 配置</h2>
            <p class="modal-desc">配置后端 API 地址以启用完整功能</p>
            
            <div class="form-group">
                <label class="form-label">API 地址</label>
                <input 
                    type="text" 
                    class="form-input" 
                    id="apiUrlInput" 
                    placeholder="http://localhost:8000"
                >
            </div>
            
            <div class="modal-actions">
                <button class="btn" onclick="closeApiModal()">取消</button>
                <button class="btn btn-primary" onclick="saveApiConfig()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 状态管理
        let currentChatId = null;
        let chatHistory = {};
        let chatList = [];
        let isGenerating = false;
        let apiAvailable = false;
        let currentTheme = 'light';

        // API 配置
        function getApiBase() {
            const params = new URLSearchParams(window.location.search);
            const urlApi = params.get('api');
            if (urlApi) {
                localStorage.setItem('api_base', urlApi);
                return urlApi.replace(/\/$/, '') + '/api';
            }
            const savedApi = localStorage.getItem('api_base');
            if (savedApi) {
                return savedApi.replace(/\/$/, '') + '/api';
            }
            if (window.location.hostname === 'localhost' || window.location.protocol === 'file:') {
                return 'http://localhost:8000/api';
            }
            return 'https://medpaper-api-5qb3.onrender.com/api';
        }

        let API_BASE = getApiBase();

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initTheme();
            loadChatList();
            checkApi();
            newChat();
        });

        // 主题管理
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            currentTheme = savedTheme;
            applyTheme(savedTheme);
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', currentTheme);
            applyTheme(currentTheme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const btn = document.querySelector('.theme-toggle');
            if (btn) {
                btn.textContent = theme === 'light' ? '🌙' : '☀️';
            }
        }

        // 侧边栏切换
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        // API 检查
        async function checkApi() {
            try {
                const resp = await fetch(API_BASE + '/health', { signal: AbortSignal.timeout(3000) });
                apiAvailable = resp.ok;
            } catch(e) {
                apiAvailable = false;
            }
            updateApiBadge();
            return apiAvailable;
        }

        function updateApiBadge() {
            const badge = document.getElementById('apiBadge');
            if (apiAvailable) {
                badge.className = 'api-badge connected';
                badge.textContent = '已连接';
                badge.title = API_BASE;
            } else {
                badge.className = 'api-badge disconnected';
                badge.textContent = '演示模式';
                badge.title = '点击配置后端地址';
            }
        }

        function openApiModal() {
            document.getElementById('apiUrlInput').value = API_BASE.replace(/\/api\/?$/, '');
            document.getElementById('apiModal').classList.add('active');
        }

        function closeApiModal() {
            document.getElementById('apiModal').classList.remove('active');
        }

        function saveApiConfig() {
            const url = document.getElementById('apiUrlInput').value.trim();
            if (url) {
                API_BASE = url.replace(/\/$/, '') + '/api';
                localStorage.setItem('api_base', url);
                checkApi();
            }
            closeApiModal();
        }

        // 聊天列表管理
        function loadChatList() {
            const saved = localStorage.getItem('chat_list');
            if (saved) {
                chatList = JSON.parse(saved);
            }
            const history = localStorage.getItem('chat_history');
            if (history) {
                chatHistory = JSON.parse(history);
            }
            renderChatList();
        }

        function saveChatList() {
            localStorage.setItem('chat_list', JSON.stringify(chatList));
            localStorage.setItem('chat_history', JSON.stringify(chatHistory));
        }

        function renderChatList() {
            const container = document.getElementById('chatListItems');
            if (chatList.length === 0) {
                container.innerHTML = '<div style="padding: 12px 8px; font-size: 12px; color: var(--text-tertiary);">暂无对话</div>';
                return;
            }
            container.innerHTML = chatList.map(chat => `
                <div class="chat-item ${chat.id === currentChatId ? 'active' : ''}" onclick="switchChat('${chat.id}')">
                    <span class="chat-item-icon">💬</span>
                    <span class="chat-item-title">${escapeHtml(chat.title)}</span>
                </div>
            `).join('');
        }

        function newChat() {
            const id = 'chat_' + Date.now();
            currentChatId = id;
            chatHistory[id] = [];
            chatList.unshift({ id, title: '新对话', time: Date.now() });
            saveChatList();
            renderChatList();
            renderMessages();
            document.getElementById('chatTitle').textContent = '新对话';
            const welcomeScreen = document.getElementById('welcomeScreen');
            if (welcomeScreen) welcomeScreen.style.display = 'flex';
            document.getElementById('messageInput').focus();
        }

        function switchChat(id) {
            currentChatId = id;
            const chat = chatList.find(c => c.id === id);
            if (chat) {
                document.getElementById('chatTitle').textContent = chat.title;
            }
            renderChatList();
            renderMessages();
        }

        function updateChatTitle(firstMessage) {
            if (!currentChatId) return;
            const chat = chatList.find(c => c.id === currentChatId);
            if (chat && chat.title === '新对话') {
                chat.title = firstMessage.substring(0, 20) + (firstMessage.length > 20 ? '...' : '');
                document.getElementById('chatTitle').textContent = chat.title;
                saveChatList();
                renderChatList();
            }
        }

        // 消息渲染
        function renderMessages() {
            const messages = chatHistory[currentChatId] || [];
            const container = document.getElementById('chatMessages');
            const welcomeScreen = document.getElementById('welcomeScreen');

            if (messages.length === 0) {
                if (welcomeScreen) welcomeScreen.style.display = 'flex';
                const messageNodes = container.querySelectorAll('.message');
                messageNodes.forEach(node => node.remove());
                return;
            }

            if (welcomeScreen) welcomeScreen.style.display = 'none';
            
            const messageNodes = container.querySelectorAll('.message');
            messageNodes.forEach(node => node.remove());
            
            let html = '';
            messages.forEach(msg => {
                html += renderMessage(msg);
            });
            container.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        function renderMessage(msg) {
            const isUser = msg.role === 'user';
            const avatar = isUser ? 'U' : 'M';
            const time = new Date(msg.time || Date.now()).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            let contentHtml = '';
            if (msg.steps) {
                contentHtml += renderStepProgress(msg.steps);
            }
            if (msg.content) {
                contentHtml += formatMessageContent(msg.content);
            }
            if (msg.thinking) {
                contentHtml += renderThinkingBlock(msg.thinking);
            }
            if (msg.literature) {
                contentHtml += renderLiteratureCards(msg.literature);
            }

            return `
                <div class="message ${msg.role}">
                    <div class="message-avatar">${avatar}</div>
                    <div class="message-content">
                        <div class="message-bubble">${contentHtml}</div>
                        <div class="message-meta">
                            <span>${time}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStepProgress(steps) {
            return `
                <div class="step-progress">
                    ${steps.map(step => `
                        <span class="step-chip ${step.status}">
                            <span class="step-chip-icon">${step.status === 'done' ? '✓' : step.status === 'active' ? '◐' : '○'}</span>
                            <span>${step.label}</span>
                        </span>
                    `).join('')}
                </div>
            `;
        }

        function renderThinkingBlock(thinking) {
            return `
                <div class="thinking-block">
                    <div class="thinking-header">
                        <span>💭</span>
                        <span>思考过程</span>
                        <div class="thinking-dots">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                    <div>${escapeHtml(thinking)}</div>
                </div>
            `;
        }

        function renderLiteratureCards(papers) {
            if (!papers || papers.length === 0) return '';
            return papers.slice(0, 5).map(paper => `
                <div class="literature-card">
                    <div class="literature-title">${escapeHtml(paper.title || '无标题')}</div>
                    <div class="literature-meta">
                        ${paper.authors ? paper.authors.join(', ') + ' · ' : ''}
                        ${paper.year || ''}
                    </div>
                    ${paper.abstract ? `<div class="literature-abstract">${escapeHtml(paper.abstract)}</div>` : ''}
                    ${paper.source ? `<span class="literature-source">${escapeHtml(paper.source)}</span>` : ''}
                </div>
            `).join('');
        }

        function formatMessageContent(text) {
            if (!text) return '';
            let html = escapeHtml(text);
            html = html.replace(/\n/g, '<br>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        // 快捷提示
        function sendQuickPrompt(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || isGenerating) return;

            const welcomeScreen = document.getElementById('welcomeScreen');
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            addMessage('user', text);
            updateChatTitle(text);
            
            input.value = '';
            autoResize(input);

            isGenerating = true;
            document.getElementById('sendBtn').disabled = true;

            showTypingIndicator();

            try {
                await generateResponse(text);
            } catch (e) {
                addMessage('assistant', '抱歉，处理您的请求时出现了错误：' + e.message);
            }

            isGenerating = false;
            document.getElementById('sendBtn').disabled = false;
            removeTypingIndicator();
        }

        function addMessage(role, content, options = {}) {
            if (!currentChatId) return;
            const msg = {
                role,
                content,
                time: Date.now(),
                ...options
            };
            if (!chatHistory[currentChatId]) {
                chatHistory[currentChatId] = [];
            }
            chatHistory[currentChatId].push(msg);
            saveChatList();
            renderMessages();
            return msg;
        }

        function updateLastMessage(updates) {
            if (!currentChatId) return;
            const messages = chatHistory[currentChatId];
            if (messages.length === 0) return;
            const last = messages[messages.length - 1];
            Object.assign(last, updates);
            saveChatList();
            renderMessages();
        }

        function showTypingIndicator() {
            const container = document.getElementById('chatMessages');
            const indicator = document.createElement('div');
            indicator.id = 'typingIndicator';
            indicator.className = 'message assistant';
            indicator.innerHTML = `
                <div class="message-avatar">M</div>
                <div class="message-content">
                    <div class="message-bubble">
                        <div class="thinking-dots">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(indicator);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // 生成响应
        async function generateResponse(userMessage) {
            const msg = addMessage('assistant', '', {
                steps: [
                    { label: '理解需求', status: 'active' },
                    { label: '处理中', status: 'pending' },
                    { label: '生成结果', status: 'pending' }
                ]
            });

            await sleep(500);
            updateLastStep(0, 'done');
            updateLastStep(1, 'active');

            let literature = [];
            let responseText = '';
            let steps = [];

            if (apiAvailable) {
                try {
                    const chatResult = await apiChat(userMessage);
                    responseText = chatResult.message || '';
                    literature = chatResult.literature || [];
                    steps = chatResult.steps || [];
                    
                    if (steps.length > 0) {
                        updateLastMessage({ steps: steps });
                    }
                    
                    updateLastStep(1, 'done');
                    updateLastStep(2, 'active');
                    await sleep(300);
                    
                } catch (e) {
                    console.error('API调用失败:', e);
                    responseText = getDemoResponse(userMessage);
                    literature = getDemoLiterature();
                }
            } else {
                await sleep(1000);
                updateLastStep(1, 'done');
                updateLastStep(2, 'active');
                await sleep(600);
                
                responseText = getDemoResponse(userMessage);
                literature = getDemoLiterature();
            }

            updateLastStep(2, 'done');
            updateLastMessage({
                content: responseText,
                literature: literature
            });
        }

        function updateLastStep(index, status) {
            if (!currentChatId) return;
            const messages = chatHistory[currentChatId];
            if (messages.length === 0) return;
            const last = messages[messages.length - 1];
            if (last.steps && last.steps[index]) {
                last.steps[index].status = status;
                saveChatList();
                renderMessages();
            }
        }

        // API 调用
        async function apiChat(message) {
            const resp = await fetch(API_BASE + '/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: currentChatId || '',
                    message: message,
                    stream: false
                })
            });
            
            if (!resp.ok) {
                throw new Error('API请求失败');
            }
            
            const data = await resp.json();
            if (!data.success) {
                throw new Error(data.message || '请求失败');
            }
            
            if (data.data.session_id) {
                currentChatId = data.data.session_id;
            }
            
            return data.data;
        }

        function buildResponseFromSearch(query, result) {
            const papers = result.papers || [];
            const gaps = result.gaps || [];
            
            let response = `根据您的研究主题「${query}」，我已完成文献检索和分析。\n\n`;
            
            response += `**📚 检索结果概览**\n`;
            response += `共检索到 ${papers.length} 篇相关文献，识别到 ${gaps.length} 个潜在研究空白。\n\n`;
            
            if (gaps.length > 0) {
                response += `**💡 研究空白识别**\n`;
                gaps.forEach((gap, i) => {
                    response += `${i + 1}. ${gap.gap_description || gap.description || '研究空白'}\n`;
                    if (gap.research_direction) {
                        response += `   建议方向：${gap.research_direction}\n`;
                    }
                    response += `\n`;
                });
            }
            
            response += `**🔬 下一步建议**\n`;
            response += `1. 查看下方文献详情，了解当前研究现状\n`;
            response += `2. 基于研究空白确定您的创新点\n`;
            response += `3. 需要我帮您生成论文大纲吗？直接告诉我即可\n`;
            
            return response;
        }

        // 演示数据
        function getDemoResponse(query) {
            return `根据您的研究主题「${query}」，我已完成文献检索和分析（演示模式）。\n\n` +
                `**📚 检索结果概览**\n` +
                `共检索到 8 篇相关文献，识别到 3 个潜在研究空白。\n\n` +
                `**💡 研究空白识别**\n` +
                `1. 联合用药的长期预后数据不足\n` +
                `   建议方向：开展多中心、大样本的长期随访研究\n\n` +
                `2. 不同亚型患者的疗效差异不明确\n` +
                `   建议方向：进行亚组分析，探索精准治疗方案\n\n` +
                `3. 药物经济学研究较少\n` +
                `   建议方向：增加成本-效果分析，为临床决策提供依据\n\n` +
                `**🔬 下一步建议**\n` +
                `1. 查看下方文献详情，了解当前研究现状\n` +
                `2. 基于研究空白确定您的创新点\n` +
                `3. 需要我帮您生成论文大纲吗？直接告诉我即可`;
        }

        function getDemoLiterature() {
            return [
                {
                    title: "依达拉奉联合丁苯酞治疗急性脑梗死的临床疗效观察",
                    authors: ["张伟", "李明", "王芳"],
                    year: 2024,
                    abstract: "目的 观察依达拉奉联合丁苯酞治疗急性脑梗死的临床疗效及安全性。方法 选取2022年1月至2023年12月我院收治的急性脑梗死患者120例，随机分为对照组和观察组，每组60例。对照组给予常规治疗+依达拉奉，观察组在对照组基础上加用丁苯酞。比较两组临床疗效、神经功能缺损评分...",
                    source: "演示数据"
                },
                {
                    title: "丁苯酞注射液对急性缺血性脑卒中患者神经功能的影响",
                    authors: ["Chen Y", "Liu H", "Zhang Q"],
                    year: 2023,
                    abstract: "Background and purpose: Butylphthalide has been shown to have neuroprotective effects in ischemic stroke. This study aimed to evaluate the efficacy and safety of butylphthalide injection in patients with acute ischemic stroke...",
                    source: "PubMed"
                },
                {
                    title: "依达拉奉的药理作用及临床应用进展",
                    authors: ["王丽", "赵刚"],
                    year: 2023,
                    abstract: "依达拉奉是一种新型自由基清除剂，具有抗氧化、抗炎、抗凋亡等多种药理作用。近年来，依达拉奉在急性脑梗死、脑出血、肌萎缩侧索硬化等神经系统疾病中的应用越来越广泛。本文就依达拉奉的药理作用机制及临床应用进展进行综述...",
                    source: "演示数据"
                }
            ];
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 输入处理
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }
    </script>
</body>
</html>
